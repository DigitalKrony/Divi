name: divi-dashboard-prod

services:
  db:
    container_name: divi_postgres
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_PASS}
      POSTGRES_DB: ${PG_DB}
      ENVIRONMENT: ${ENVIRONMENT:-Production}
    env_file:
      - .env
    volumes:
      - postgres_data_v1:/var/lib/postgresql/data

  api:
    container_name: divi_api
    image: ghcr.io/digitalkrony/divi-api:latest
    restart: on-failure:3
    depends_on:
      - db
    environment:
      PG_DB_USER: ${PG_DB_USER}
      PG_DB_PASS: ${PG_DB_PASS}
      PG_DB: ${PG_DB}
      PG_DB_HOST: db
      PG_DB_PORT: 5432
      ENVIRONMENT: ${ENVIRONMENT:-Production}
    volumes:
      - ./apps/middleware:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    container_name: divi_web
    # image: ghcr.io/DigitalKrony/divi-web:latest
    restart: unless-stopped
    working_dir: /app/apps/web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: true
      ENVIRONMENT: ${ENVIRONMENT:-Production}
    command: npm run start:web:prod
    labels:
      - 'diun.enable=false'

  storybook:
    container_name: divi_docs
    # image: ghcr.io/digitalkrony/divi-docs:latest
    restart: unless-stopped
    working_dir: /app/packages/divi-docs
    build:
      context: .
      dockerfile: ./packages/divi-docs/Dockerfile
    depends_on:
      - web
    environment:
      CHOKIDAR_USEPOLLING: true
      ENVIRONMENT: ${ENVIRONMENT:-Production}
    command: npm run start:docs:prod
    labels:
      - 'diun.enable=true'

  nginx:
    container_name: divi_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - api
      - web
    labels:
      - 'diun.enable=false'
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot

  certbot:
    container_name: divi_certbot
    image: certbot/certbot
    depends_on:
      - nginx
    profiles:
      - cli-only
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot

  diun:
    container_name: divi_diun
    image: crazymax/diun:latest
    restart: always
    command: serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Detroit
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_WATCH_SCHEDULE=0 * * * *
      - DIUN_NOTIF_DISCORD_WEBHOOKURL=${NOTIFICATION_WEBHOOK}

volumes:
  postgres_data_v1:
  certbot-etc:
  certbot-var:
